[project]
name = "goldgraveyard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mtjia", email = "mtjia.labs@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pandas-datareader>=0.11.1",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "scipy>=1.18.0",
    "statsmodels>=0.14.6",
    "yfinance>=1.6.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.3",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
